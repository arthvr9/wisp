name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The sprite sheets, tray icons and README images under resources/ and docs/images/ are
      # generated by scripts/make-placeholder-sprites.mjs and scripts/make-docs-images.mjs. They
      # are committed so the app runs from a fresh clone, which means they can silently drift from
      # their generator. Regenerating here and failing on a dirty tree is the only place that
      # invariant can be enforced. The generators take no time and no randomness, so a diff always
      # means someone edited the art by hand or changed the generator without rerunning it.
      # The check compares pixels, not file bytes: two zlib versions encode identical pixels
      # into different bytes, so a byte comparison fails whenever the runner's Node differs
      # from the author's while the art is in fact unchanged.
      - name: Art matches its generators
        run: |
          npm run sprites
          node scripts/check-art.mjs
